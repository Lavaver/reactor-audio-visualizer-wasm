<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="646" viewBox="0 0 1000 646" role="img" aria-label="Analysis cost per frame and wasm module size per kernel">
<style>
  text { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .title { font-size: 16px; font-weight: 700; fill: #dbe6f0; letter-spacing: 0.4px; }
  .h { font-size: 13px; font-weight: 700; fill: #dbe6f0; letter-spacing: 0.3px; }
  .note { font-size: 10.5px; fill: #6b7c8f; }
  .label { font-size: 12px; fill: #dbe6f0; }
  .value { font-size: 12px; font-weight: 700; fill: #dbe6f0; }
  .pct { font-size: 12px; fill: #dbe6f0; }
  .tick { font-size: 10px; fill: #6b7c8f; }
</style>
<rect width="100%" height="100%" fill="#0b1016"/>
<text x="24" y="50" class="title">reactor kernel · analysis cost</text>
<text x="24" y="70" class="note">node scripts/bench.mjs · 600 frames after 60 warm-up · 2048 samples/frame at 48000 Hz · analysis only, no rendering</text>
<text x="24" y="92" class="h">analysis per frame (ms)</text>
<text x="24" y="111" class="note">bar = mean, outline = p95; the v3 bar is split into FFT and CQT at the same total</text>
<text x="976" y="111" class="note" text-anchor="end">% of 16.67 ms frame</text>
